# =============================================================================
#  OPTIONAL - not applied by deploy.sh.
#
#  Automatic HTTPS certificates (Let's Encrypt) that renew themselves.
#
#  Why it matters: the site tells browsers to use HTTPS only (HSTS). If the
#  certificate ever expires, browsers refuse the site and offer no "continue
#  anyway" button. Renewing by hand every 90 days is easy to forget.
#
#  Do you need this?
#      kubectl -n leadcrm get certificate
#  If that lists "leadcrm-tls-secret" with READY = True, renewal is already
#  automatic and there is nothing to do.
#
#  Otherwise:
#   1. Install cert-manager (one command, from its official instructions):
#          https://cert-manager.io/docs/installation/kubectl/
#      and wait until:  kubectl -n cert-manager get pods     shows three pods Running
#   2. Put your e-mail address below (Let's Encrypt sends expiry warnings to it).
#   3. kubectl apply -f k8s/optional/cert-manager-issuer.yaml
#   4. The ingress (k8s/ingress.yaml) already asks for a certificate from the issuer
#      named "letsencrypt-prod". After a minute or two:
#          kubectl -n leadcrm get certificate        -> READY = True
#
#  The domain must point to this server and port 80 must be reachable from the
#  internet (Let's Encrypt checks the domain over plain HTTP).
# =============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: change-me@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
