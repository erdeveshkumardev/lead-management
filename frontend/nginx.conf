# =============================================================================
#  Web server of the Lead-to-Cash front end (unprivileged nginx, port 8080).
#
#  This file is a TEMPLATE: when the container starts, ${BACKEND_UPSTREAM} is
#  replaced with the address of the API (see frontend/Dockerfile).
#    docker-compose : http://backend:8000
#    Kubernetes     : http://backend-service:8000
#
#  The browser talks to ONE address only. "/api/..." is passed on to the API,
#  so the session cookie is first-party and no cross-site (CORS) access is needed.
# =============================================================================

server_tokens off;

# Real visitor address for the logs when a load balancer / ingress sits in front.
# (The API works out the client address itself from X-Forwarded-For.)
log_format lc_main '$remote_addr - [$time_local] "$request_method $lc_safe_uri $server_protocol" '
                   '$status $body_bytes_sent rt=$request_time';

# Webhook addresses carry a private token in the path and password-reset or other
# tokens may appear in a query string: neither is ever written to the access log.
map $request_uri $lc_uri_no_query {
    "~^(?<lc_path>[^?]*)"   $lc_path;
    default                 $request_uri;
}
map $lc_uri_no_query $lc_safe_uri {
    "~^(?<lc_prefix>/api/v[0-9]+/webhooks/[^/]+/[^/]+)/.+$"   "$lc_prefix/[redacted]";
    default                                                    $lc_uri_no_query;
}

server {
    # IPv4 only, like the previous configuration: "listen [::]:8080" stops nginx from starting
    # on a server where IPv6 is switched off.
    listen 8080;
    server_name _;
    # nginx runs on 8080 behind the ingress / port mapping: a redirect it creates must not contain that port
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log lc_main;

    # Uploads (CSV import) are limited by the API to 5 MB; anything bigger is refused here already.
    client_max_body_size 6m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 65s;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/woff font/woff2;

    # Liveness / readiness probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ---- API (same origin as the web application) ----------------------------------------------------
    # No "add_header" here on purpose: the API sends its own security headers for its answers.
    # "^~" = once this prefix matches, no pattern location below is tried for an API address.
    location ^~ /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        # never let a cache between the user and the API keep a private answer
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ---- Web application ---------------------------------------------------------------------------------
    # Build files have a content hash in their name, so browsers may keep them for a long time.
    location ^~ /assets/ {
        include /etc/nginx/lc-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The page itself is never cached, so a new release is picked up on the next visit.
    location = /index.html {
        include /etc/nginx/lc-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Any other path is a screen of the single-page application.
    location / {
        include /etc/nginx/lc-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # Hidden files (".git", ".env", ...) are never served, even if one is copied into the web root by mistake.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
