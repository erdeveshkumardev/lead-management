apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leadcrm-ingress
  namespace: leadcrm
  annotations:
    kubernetes.io/ingress.class: "traefik" # or "nginx" depending on ingress controller
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - leadcrm.travistas.in
      secretName: leadcrm-tls-secret
  rules:
    - host: leadcrm.travistas.in
      http:
        paths:
          # Backend API Routing
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Frontend React SPA Routing
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
