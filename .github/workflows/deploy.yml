name: Release

# Every push to "main" is tested and then released to the server by deploy.sh.
# deploy.sh is all-or-nothing: if the cluster Secret is not prepared, or a new image does not pass its
# checks, the release stops and the running version stays in place (see the header of deploy.sh).

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# One release at a time. A newer push waits; a running release is never cancelled half-way.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to a full commit id, so a moved tag cannot change what runs here.
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install the locked back-end packages
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Back-end tests
        working-directory: backend
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Front-end type check and build
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

  deploy:
    name: Release to the server
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run deploy.sh on the server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # Recommended: add the secret VPS_SSH_FINGERPRINT so the runner only talks to YOUR server.
          # Value: output of   ssh-keygen -l -f /etc/ssh/ssh_host_ed25519_key.pub | cut -d ' ' -f2   on the server.
          # (While the secret is empty the host key is not checked, exactly as before.)
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -e
            cd /root/lead-management

            # A "chmod +x" done on the server must not count as a local change.
            git config core.fileMode false

            # Release exactly the commit that passed the tests above.
            git fetch --quiet origin main
            if ! git merge --ff-only --quiet "${{ github.sha }}"; then
              echo "The copy of the project on the server has local changes or commits that are not on GitHub."
              echo "Nothing was released. On the server run:  cd /root/lead-management && git status"
              echo "(k8s/secret.yaml is no longer used - if it is listed, discard it:  git checkout -- k8s/secret.yaml )"
              exit 1
            fi

            bash deploy.sh
