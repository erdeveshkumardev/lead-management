name: Security checks

# Runs on every pull request and push, and once a week on its own:
# new vulnerabilities are published for code that has not changed.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: No credentials in the repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Look for files and values that must never be committed
        run: bash scripts/check-no-secrets.sh

  backend:
    name: Back end (tests, static analysis, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: requirements.lock matches requirements.txt
        run: python ../scripts/check-lock.py

      - name: Install the locked packages
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Tests (authentication, tenant isolation, billing, webhooks)
        run: python -m pytest -q

      - name: Static security analysis (medium and high findings fail the build)
        run: python -m bandit -q -r app -ll

      - name: Known vulnerabilities in the locked packages
        run: python -m pip_audit -r requirements.lock --require-hashes --disable-pip

  frontend:
    name: Front end (build, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly what package-lock.json lists (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check and build
        run: npm run build

      - name: Known vulnerabilities in what is shipped to the browser (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high

      - name: Build tools - report only (see SECURITY.md, "Known and accepted")
        run: npm audit || true
