# =============================================================================
#  OPTIONAL hardening - not applied by deploy.sh.
#
#  Only the ingress controller may reach the pods; nothing else in the cluster can
#  call the API or the web server directly.
#
#  The rules below assume the K3s default: Traefik running in the "kube-system"
#  namespace. CHECK FIRST, because a wrong selector cuts the site off:
#
#      kubectl -n kube-system get pods -l app.kubernetes.io/name=traefik
#
#  If that prints your ingress pods:      kubectl apply -f k8s/optional/networkpolicy.yaml
#  Then open the site. To undo:           kubectl delete -f k8s/optional/networkpolicy.yaml
#  (With ingress-nginx use namespace "ingress-nginx" and label app.kubernetes.io/name=ingress-nginx.)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: leadcrm
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-backend
  namespace: leadcrm
spec:
  podSelector:
    matchLabels:
      app: leadcrm-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # the web server forwards /api/ when it is reached on its own
        - podSelector:
            matchLabels:
              app: leadcrm-frontend
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-frontend
  namespace: leadcrm
spec:
  podSelector:
    matchLabels:
      app: leadcrm-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
