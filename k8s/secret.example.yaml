# =============================================================================
#  TEMPLATE ONLY - this file is documentation and is never applied.
#
#  The real Secret is created directly in the cluster and is never written to a
#  file that could be committed:
#
#      bash scripts/setup-cluster-secret.sh
#
#  (It asks for the MongoDB connection string without showing it on screen,
#   creates the two application keys once and keeps them on later runs.)
#
#  Keys the API needs:
#    MONGODB_URL       mongodb+srv://<user>:<password>@<cluster-host>/   - dedicated DB user, strong unique password
#    SECRET_KEY        random, at least 32 characters (signs sign-in tokens)
#    ENCRYPTION_KEYS   Fernet key (encrypts stored API keys / gateway passwords / 2FA seeds)
#                      NEVER replace it without the rotation procedure in SECURITY.md:
#                      data encrypted with a lost key cannot be read again.
#  Optional, first start only (remove afterwards):
#    BOOTSTRAP_SUPERADMIN_EMAIL / BOOTSTRAP_SUPERADMIN_PASSWORD
#  Optional platform e-mail relay (password-reset and welcome e-mails):
#    SMTP_HOST / SMTP_PORT / SMTP_USERNAME / SMTP_PASSWORD / SMTP_FROM
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: leadcrm-secret
  namespace: leadcrm
type: Opaque
stringData:
  MONGODB_URL: "<set with scripts/setup-cluster-secret.sh>"
  SECRET_KEY: "<generated by scripts/setup-cluster-secret.sh>"
  ENCRYPTION_KEYS: "<generated by scripts/setup-cluster-secret.sh>"
