# Security headers for every page and file of the web application.
# (Included in each "location" because nginx does not inherit add_header into a
#  location that defines an add_header of its own.)

# Only this site's own scripts, styles, fonts and API may be used by the page:
#   - no inline or third-party script can run (the main defence against XSS)
#   - the page cannot be shown inside a frame of another site (clickjacking)
#   - forms can only be sent to this site
# 'unsafe-inline' is limited to styles (the UI library sets style attributes); "data:" images are the 2FA QR code.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Browsers that have visited the site once over HTTPS will refuse plain HTTP for a year.
# (Ignored by browsers when the page itself was loaded over plain HTTP.)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
